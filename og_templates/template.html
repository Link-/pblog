<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #f6f3ec;
        color: #172019;
        font-family: Arial, Helvetica, sans-serif;
      }

      .canvas {
        position: relative;
        display: grid;
        width: 1200px;
        height: 630px;
        grid-template-columns: 790px 410px;
        overflow: hidden;
        background:
          radial-gradient(circle at 8% 92%, rgba(216, 75, 42, 0.1), transparent 24%),
          #f6f3ec;
      }

      .canvas::before {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(23, 32, 25, 0.09) 0.7px, transparent 0.7px);
        background-size: 8px 8px;
        content: "";
        opacity: 0.38;
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        padding: 58px 64px 50px;
        flex-direction: column;
      }

      .brand {
        display: flex;
        gap: 13px;
        align-items: center;
      }

      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #172019;
        color: #f6f3ec;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1px;
        place-items: center;
      }

      .brand-copy strong,
      .brand-copy span {
        display: block;
      }

      .brand-copy strong {
        font-size: 14px;
        letter-spacing: 0.2px;
      }

      .brand-copy span {
        margin-top: 3px;
        color: #647067;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }

      .note-meta {
        margin: auto 0 17px;
        color: #d84b2a;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }

      h1 {
        max-width: 690px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: {{titleFontSize}}px;
        font-weight: 400;
        letter-spacing: -2.5px;
        line-height: 0.98;
      }

      .description {
        max-width: 650px;
        margin: 22px 0 0;
        color: #647067;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 19px;
        line-height: 1.4;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-top: auto;
      }

      .tags {
        display: flex;
        gap: 7px;
      }

      .tag {
        padding: 5px 9px;
        border: 1px solid #d8d7cf;
        border-radius: 999px;
        color: #647067;
        font-size: 8px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .url {
        color: #172019;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.7px;
      }

      .visual {
        position: relative;
        z-index: 1;
        display: grid;
        overflow: hidden;
        background: #1d4933;
        place-items: center;
      }

      .visual::before,
      .visual::after {
        position: absolute;
        width: 430px;
        height: 230px;
        border: 1px solid rgba(246, 243, 236, 0.28);
        border-radius: 50%;
        content: "";
        transform: rotate(37deg);
      }

      .visual::after {
        width: 230px;
        height: 430px;
      }

      .portrait-ring {
        position: relative;
        z-index: 2;
        width: 270px;
        height: 330px;
        padding: 10px;
        border: 1px solid rgba(246, 243, 236, 0.58);
        border-radius: 48% 48% 16px 16px;
        background: rgba(246, 243, 236, 0.08);
        transform: rotate(2deg);
      }

      .portrait-ring img {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        object-fit: cover;
        filter: saturate(0.72) contrast(1.04);
      }

      .year {
        position: absolute;
        right: 30px;
        bottom: 26px;
        z-index: 3;
        color: rgba(246, 243, 236, 0.72);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 28px;
      }

      .accent {
        position: absolute;
        top: -70px;
        right: -70px;
        width: 170px;
        height: 170px;
        border-radius: 50%;
        background: #d84b2a;
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <section class="content">
        <header class="brand">
          <span class="brand-mark">BD</span>
          <span class="brand-copy">
            <strong>Bassem Dghaidi</strong>
            <span>Software, systems &amp; people</span>
          </span>
        </header>

        <div class="note-meta">{{dateLabel}} / {{readingMinutes}} min read</div>
        <h1>{{title}}</h1>
        <p class="description">{{description}}</p>

        <footer class="footer">
          <div class="tags">
            {{#each categories}}<span class="tag">{{this}}</span>{{/each}}
          </div>
          <span class="url">blog.bassemdy.com</span>
        </footer>
      </section>

      <aside class="visual" aria-hidden="true">
        <span class="accent"></span>
        <div class="portrait-ring">
          <img src="{{{portraitDataUri}}}" alt="">
        </div>
        <span class="year">{{year}}</span>
      </aside>
    </main>
  </body>
</html>
