name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - '_posts/**'
      - '_data/**'
      - 'assets/**'
      - '_layouts/**'
      - '_includes/**'
      - '_sass/**'
      - 'script/**'
      - 'og_templates/**'
      - '_config.yml'
      - 'Gemfile*'
      - '**.md'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: live

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: script/package-lock.json
    - name: Cache Puppeteer browser
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-${{ hashFiles('script/package-lock.json') }}
    - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: '3.1.3'

    - name: Install thumbnail dependencies
      run: npm ci --prefix script

    - name: Generate missing social thumbnails
      run: npm run generate --prefix script
    
    # Restore the vendor/bundle folder
    # from cache
    - name: Cache ruby gems
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        cache-name: ruby-gems
      with:
        path: vendor/bundle
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/Gemfile.lock') }}

    - name: Install Dependencies
      run: |
        gem install bundler
        bundle config set path 'vendor/bundle'
        bundle install --jobs=4

    - name: Build
      run: |
        bundle exec jekyll build

    - name: Deploy to Server
      uses: easingthemes/ssh-deploy@5d8aeab1a56041e269567e67a08ce00df324a617 # v6.0.1
      with:
        SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        ARGS: "-raL --delete"
        SOURCE: "_site/"
        REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        REMOTE_USER: ${{ secrets.REMOTE_USER }}
        TARGET: ${{ secrets.REMOTE_DEPLOY_PATH }}
        REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
