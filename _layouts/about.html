---
layout: default
---
<section class="about-hero shell">
  <header class="page-header">
    <p class="eyebrow">{{ page.eyebrow | default: "About" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
</section>

<section class="speaker-bio">
  <div class="shell bio-grid">
    <div class="headshot-picker" data-headshot-picker>
      <div class="headshot-preview">
        <img
          src="{{ "/assets/img/bio/profile_square_2759x2759.jpg" | relative_url }}"
          alt="Selected headshot of Bassem Dghaidi against a neutral background"
          width="2759"
          height="2759"
          loading="lazy"
          data-headshot-preview>
        <span data-headshot-label>Neutral portrait</span>
      </div>
      <div class="headshot-options" role="group" aria-label="Choose a headshot">
        <button
          class="headshot-option is-selected"
          type="button"
          aria-pressed="true"
          data-headshot-src="{{ "/assets/img/bio/profile_square_2759x2759.jpg" | relative_url }}"
          data-headshot-label="Neutral portrait"
          data-headshot-alt="Selected headshot of Bassem Dghaidi against a neutral background"
          data-headshot-filename="bassem-dghaidi-neutral-headshot.jpg">
          <img src="{{ "/assets/img/bio/profile_square_2759x2759.jpg" | relative_url }}" alt="" width="2759" height="2759" loading="lazy">
          <span>Neutral</span>
        </button>
        <button
          class="headshot-option"
          type="button"
          aria-pressed="false"
          data-headshot-src="{{ "/assets/img/bio/profile_bassem_2805.jpg" | relative_url }}"
          data-headshot-label="Studio portrait"
          data-headshot-alt="Selected studio headshot of Bassem Dghaidi against a blue background"
          data-headshot-filename="bassem-dghaidi-studio-headshot.jpg">
          <img src="{{ "/assets/img/bio/profile_bassem_2805.jpg" | relative_url }}" alt="" width="2805" height="2805" loading="lazy">
          <span>Studio</span>
        </button>
        <button
          class="headshot-option"
          type="button"
          aria-pressed="false"
          data-headshot-src="{{ "/assets/img/bio/bassem_3_1080x1080.png" | relative_url }}"
          data-headshot-label="Casual portrait"
          data-headshot-alt="Selected casual headshot of Bassem Dghaidi in a dark shirt"
          data-headshot-filename="bassem-dghaidi-casual-headshot.png">
          <img src="{{ "/assets/img/bio/bassem_3_1080x1080.png" | relative_url }}" alt="" width="1080" height="1080" loading="lazy">
          <span>Casual</span>
        </button>
      </div>
    </div>
    <div class="bio-copy">
      <p class="eyebrow">Biography</p>
      {{ page.biography | markdownify }}
      <div class="bio-actions">
        <a class="button button-primary" href="mailto:letsworktogether@interop.com.co">Get in touch</a>
        <a
          class="text-link"
          href="{{ "/assets/img/bio/profile_square_2759x2759.jpg" | relative_url }}"
          download="bassem-dghaidi-neutral-headshot.jpg"
          data-headshot-download>
          Download selected headshot <span aria-hidden="true">↓</span>
        </a>
      </div>
    </div>
  </div>
</section>

<section class="about-details shell">
  <div class="prose">
    {{ content }}
  </div>
</section>
